<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Live Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PapaParse for CSV Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .live-dot {
      animation: pulse-subtle 2s infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header Section -->
    <header class="flex flex-col md:flex-row md:items-center md:justify-between pb-6 border-b border-slate-200 gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 flex items-center gap-2">
          <span>ระบบแดชบอร์ดติดตามข้อมูล</span>
          <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
            <span class="w-2 h-2 rounded-full bg-emerald-500 live-dot"></span>
            LIVE
          </span>
        </h1>
        <p class="text-sm text-slate-500 mt-1">อัปเดตข้อมูลอัตโนมัติจาก Google Sheets ทุก 30 วินาที</p>
      </div>

      <div class="flex items-center gap-3 text-sm">
        <span id="last-updated" class="text-slate-500">กำลังโหลดข้อมูล...</span>
        <button id="refresh-btn" onclick="fetchData()" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white border border-slate-300 rounded-lg shadow-sm hover:bg-slate-100 transition active:scale-95 text-slate-700 font-medium text-xs sm:text-sm cursor-pointer">
          <i data-lucide="refresh-cw" class="w-4 h-4" id="refresh-icon"></i>
          รีเฟรชตอนนี้
        </button>
      </div>
    </header>

    <!-- KPI / Metric Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-6">
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-slate-500">จำนวนแถวข้อมูลทั้งหมด</p>
          <p id="total-rows" class="text-2xl font-bold text-slate-900 mt-1">-</p>
        </div>
        <div class="p-3 bg-blue-50 text-blue-600 rounded-lg">
          <i data-lucide="list-filter" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-slate-500">จำนวนคอลัมน์</p>
          <p id="total-cols" class="text-2xl font-bold text-slate-900 mt-1">-</p>
        </div>
        <div class="p-3 bg-purple-50 text-purple-600 rounded-lg">
          <i data-lucide="columns-3" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-sm font-medium text-slate-500">สถานะการเชื่อมต่อ</p>
          <p id="sync-status" class="text-2xl font-bold text-amber-500 mt-1">กำลังเชื่อมต่อ...</p>
        </div>
        <div class="p-3 bg-amber-50 text-amber-600 rounded-lg" id="status-icon-wrap">
          <i data-lucide="activity" class="w-6 h-6"></i>
        </div>
      </div>
    </div>

    <!-- Controls & Search -->
    <div class="mt-8 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="relative w-full sm:w-80">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
          <i data-lucide="search" class="w-4 h-4"></i>
        </span>
        <input 
          type="text" 
          id="search-input" 
          oninput="handleSearch()" 
          placeholder="ค้นหาข้อมูลในตาราง..." 
          class="w-full pl-9 pr-4 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm"
        />
      </div>
      <div class="text-xs text-slate-400 self-end sm:self-center">
        แสดงข้อมูล: <span id="displayed-count">0</span> รายการ
      </div>
    </div>

    <!-- Data Table Container -->
    <div class="mt-4 bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto max-h-[600px] relative">
        <table class="w-full text-left border-collapse text-sm">
          <thead id="table-head" class="bg-slate-100 text-slate-700 sticky top-0 z-10 border-b border-slate-200 uppercase text-xs tracking-wider">
            <!-- Dynamic Headers -->
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-200">
            <tr>
              <td colspan="100%" class="text-center py-12 text-slate-400">
                กำลังดึงข้อมูลเรียลไทม์...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ลิงก์ CSV จากชีตของคุณ
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQu_e0s7LE3r8JX8u4_oKSzqdhF5Zdf3z9G9pochFn8UetIpPAXtjYnlEocSwm7RJLh0YsbiJyJI4qL/pub?gid=484645316&single=true&output=csv";
    const REFRESH_INTERVAL = 30000; // 30 วินาที

    let rawData = [];
    let headers = [];

    async function fetchData() {
      const refreshIcon = document.getElementById("refresh-icon");
      if (refreshIcon) refreshIcon.classList.add("animate-spin");

      const targetUrl = `${CSV_URL}&_t=${Date.now()}`;
      let csvText = "";

      try {
        // ลองดึงตรงๆ จาก Google Sheets
        try {
          const directRes = await fetch(targetUrl);
          if (directRes.ok) {
            csvText = await directRes.text();
          }
        } catch (e) {
          console.warn("Direct fetch blocked by browser, trying proxy...");
        }

        // หากดึงตรงไม่ผ่าน ให้สลับไปใช้ CORS Proxy สำรอง
        if (!csvText) {
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
          const proxyRes = await fetch(proxyUrl);
          if (!proxyRes.ok) throw new Error("ไม่สามารถดาวน์โหลดข้อมูลได้");
          csvText = await proxyRes.text();
        }

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: "greedy",
          complete: function(results) {
            if (!results.data || results.data.length === 0) {
              throw new Error("ไม่มีข้อมูลในไฟล์");
            }

            headers = results.meta.fields || [];
            rawData = results.data;

            updateDashboardUI();

            const statusEl = document.getElementById("sync-status");
            statusEl.innerText = "เชื่อมต่อแล้ว";
            statusEl.className = "text-2xl font-bold text-emerald-600 mt-1";
          }
        });
      } catch (err) {
        console.error("Fetch Error:", err);
        const statusEl = document.getElementById("sync-status");
        statusEl.innerText = "เชื่อมต่อล้มเหลว";
        statusEl.className = "text-2xl font-bold text-rose-600 mt-1";
      } finally {
        if (refreshIcon) refreshIcon.classList.remove("animate-spin");
        updateTimestamp();
        lucide.createIcons();
      }
    }

    function updateDashboardUI() {
      document.getElementById("total-rows").innerText = rawData.length.toLocaleString();
      document.getElementById("total-cols").innerText = headers.length.toLocaleString();

      const thead = document.getElementById("table-head");
      thead.innerHTML = "";
      const trHead = document.createElement("tr");

      headers.forEach(h => {
        const th = document.createElement("th");
        th.className = "px-6 py-3.5 font-semibold text-slate-700 whitespace-nowrap bg-slate-100";
        th.innerText = h || "(ว่าง)";
        trHead.appendChild(th);
      });
      thead.appendChild(trHead);

      renderTableRows(rawData);
    }

    function renderTableRows(data) {
      const tbody = document.getElementById("table-body");
      tbody.innerHTML = "";
      document.getElementById("displayed-count").innerText = data.length.toLocaleString();

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${Math.max(headers.length, 1)}" class="text-center py-8 text-slate-400">ไม่พบรายการข้อมูล</td></tr>`;
        return;
      }

      data.forEach(row => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50 transition-colors";

        headers.forEach(h => {
          const td = document.createElement("td");
          td.className = "px-6 py-3 whitespace-nowrap text-slate-600 border-b border-slate-100";
          td.innerText = row[h] !== undefined ? row[h] : "";
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });
    }

    function handleSearch() {
      const query = document.getElementById("search-input").value.toLowerCase().trim();
      if (!query) {
        renderTableRows(rawData);
        return;
      }

      const filtered = rawData.filter(row => {
        return headers.some(h => String(row[h] || "").toLowerCase().includes(query));
      });

      renderTableRows(filtered);
    }

    function updateTimestamp() {
      const now = new Date();
      document.getElementById("last-updated").innerText = `อัปเดตล่าสุด: ${now.toLocaleTimeString("th-TH")}`;
    }

    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      fetchData();
      setInterval(fetchData, REFRESH_INTERVAL);
    });
  </script>
</body>
</html>
